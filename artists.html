<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Художники - Art Oasis</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-container">
    <header id="main-header" class="header">
      <div class="header-container container">
        <div class="header-left">
          <a href="index.html" class="logo">
            <span class="logo-text">Art Oasis</span>
          </a>
          <nav class="main-nav">
            <a href="artworks.html" class="nav-link">Работы</a>
            <a href="events.html" class="nav-link">Мероприятия</a>
            <a href="inspiration.html" class="nav-link">Вдохновение</a>
            <a href="meetings.html" class="nav-link">Встречи</a>
            <a href="blog.html" class="nav-link">Блог</a>
            <a href="about.html" class="nav-link">О нас</a>
          </nav>
        </div>
        <div class="header-right">
          <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input
              id="search-input"
              type="text"
              class="search-input"
              placeholder="Поиск работ, художников..."
            />
          </div>
          <button id="theme-toggle" class="theme-toggle">
            <i class="fas fa-sun"></i>
          </button>
          <div class="header__profile-controls">
            <a href="login.html" class="btn btn-outline">Войти</a>
            <a href="register.html" class="btn btn-primary">Регистрация</a>
          </div>
          <span>name</span>
        </div>
      </div>
    </header>
    <main>
      <section class="section">
        <div class="section-header container">
          <h2 class="section-title">Все художники</h2>
          <p class="section-description">
            Познакомьтесь с талантливыми создателями нашего сообщества
          </p>
        </div>
        <div id="artists-grid" class="artists-grid container"></div>
      </section>
    </main>
    <footer id="main-footer" class="footer">
      <div class="footer-container container">
        <div class="copyright">
          <p>
            © <span id="current-year"></span> Art Oasis. Все права защищены.
          </p>
        </div>
        <div class="footer-right">
          <a href="#" class="footer-link">Условия</a>
          <a href="#" class="footer-link">Конфиденциальность</a>
          <a href="#" class="footer-link">Контакты</a>
        </div>
      </div>
    </footer>
    <template id="artist-card-template">
      <div class="artist-card">
        <div class="artist-content">
          <div class="artist-avatar">
            <img class="avatar-image" src="" alt="Artist Avatar" />
          </div>
          <h3 class="artist-name">
            <a class="artist-link"></a>
          </h3>
          <span class="artist-specialty"></span>
          <p class="artist-bio"></p>
          <div class="artist-stats">
            <div class="stat">
              <i class="fas fa-palette"></i>
              <span class="artwork-count"></span>
            </div>
            <div class="stat">
              <i class="fas fa-users"></i>
              <span class="follower-count"></span>
            </div>
          </div>
        </div>
        <div class="artist-footer">
          <button class="follow-button btn btn-sm">Follow</button>
          <a class="view-profile-button btn btn-sm btn-outline"
            >Просмотр профиля</a
          >
        </div>
      </div>
    </template>

    <script>
      const header_authorize = document.querySelector(
        ".header__profile-controls"
      );

      if (localStorage.getItem("ArtOasis-token")) {
        header_authorize.style.display = "none";
      }
    </script>
    <script src="/scripts/unauthorized.js"></script>
    <script src="/scripts/scriptartists.js"></script>
  </body>
</html>
